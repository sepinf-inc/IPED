name: Java CI

on: [push, pull_request]

jobs:

  build:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25 (Liberica Full, with JavaFX)
      uses: actions/setup-java@v6
      with:
        distribution: liberica
        java-version: '25'
        java-package: jdk+fx
        cache: maven

    - name: Load libagdb from cache
      id: libagdb
      uses: actions/cache@v6
      with:
        path: libagdb
        key: libagdb-ubuntu-26.04-667a782

    - name: Compile libagdb
      # libagdb (agdbinfo) needs to be built from source
      if: steps.libagdb.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y git autoconf automake autopoint libtool pkg-config
        git clone https://github.com/libyal/libagdb.git && cd libagdb/ && git checkout 667a782
        ./synclibs.sh && ./autogen.sh && ./configure

    - name: Install External Tools
      run: |
        sudo apt-get update && sudo apt-get install -y \
          libscca-utils rifiuti2 libevtx-utils libevt-utils \
          libmsiecf-utils pff-tools libesedb-utils \
          tesseract-ocr tesseract-ocr-por \
          imagemagick fonts-urw-base35
        sudo perl -MCPAN -e 'install Parse::Win32Registry'
        cd libagdb/ && sudo make install && sudo ldconfig /usr/local/lib

    - name: Create Python venv with jep (tests only)
      # jep is compiled against JAVA_HOME, so this must run after setup-java.
      # The venv activate script also sets what the embedded interpreter and the
      # ci-jep surefire profile (iped-parsers-impl) need.
      run: |
        sudo apt-get install -y python3-venv python3-dev
        python3 -m venv "$RUNNER_TEMP/venv"
        source "$RUNNER_TEMP/venv/bin/activate"
        pip install --no-cache-dir jep
        SITE=$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
        JEP_DIR=$(python -c 'import jep, os; print(os.path.dirname(jep.__file__))')
        cat >> "$VIRTUAL_ENV/bin/activate" <<ACTIVATE

        # IPED: needed by embedded jep (PythonParserTest) and by the ci-jep surefire profile
        export PYTHONPATH="$SITE"
        export LD_LIBRARY_PATH="$JEP_DIR\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}"
        export JEP_JAR="$(ls $JEP_DIR/jep-*.jar)"
        ACTIVATE

    - name: Print tool versions
      run: |
        source "$RUNNER_TEMP/venv/bin/activate"
        java -version; mvn -v; python --version; python -c 'import jep; print("jep", jep.__version__)'
        pffexport -V | head -1; esedbexport -V | head -1; msiecfexport -V | head -1
        tesseract --version | head -1

    - name: Build with Maven
      run: |
        source "$RUNNER_TEMP/venv/bin/activate"
        mvn -B -ntp package --file pom.xml

    - name: Package snapshot
      run: cd target && mv release iped-snapshot-$GITHUB_SHA && tar -zcvf ../iped-snapshot.tar.gz iped-snapshot-$GITHUB_SHA

    - name: Upload snapshot
      uses: actions/upload-artifact@v7
      with:
        name: iped-snapshot-${{ github.sha }}
        path: iped-snapshot.tar.gz
