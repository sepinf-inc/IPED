name: Java CI

on: [push]

jobs:

  build-java11:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v1
    - name: Set up JDK 11
      uses: actions/setup-java@v1
      with:
        java-version: 11
        java-package: jdk+fx

    - name: Load libagdb from cache
      id: libagdb
      uses: actions/cache@v4
      with:
        path: libagdb
        key: libagdb

    - name: Compile libagdb
      # libagdb (agdbinfo) needs to be built from source
      if: steps.libagdb.outputs.cache-hit != 'true'
      run: | 
            sudo apt install git autoconf automake autopoint libtool pkg-config
            git clone https://github.com/libyal/libagdb.git && cd libagdb/ && git checkout 667a782
            sudo ./synclibs.sh && sudo ./autogen.sh && sudo ./configure

    - name: Install External Tools
      run: |
          sudo apt-get update && sudo apt-get install \
          libscca-utils rifiuti2 libevtx-utils libevt-utils \
          libmsiecf-utils=20181227-2build1 \
          pff-tools=20180714-3build1 \
          libesedb-utils=20181229-3.1build2 \
          tesseract-ocr \
          tesseract-ocr-por \
          imagemagick \
          python3-pip
          sudo perl -MCPAN -e 'install Parse::Win32Registry'
          pip install jep==4.0.3

          cd libagdb/ && sudo make install
          sudo ldconfig /usr/local/lib
          cd ..
          sudo apt-get install gsfonts

    - name: Verify bundled libyara-x-capi (YARA-X engine, Linux)
      # The YARA-X 1.16.0 upstream release does NOT publish a prebuilt
      # libyara-x-capi for Linux x86_64 (only Windows MSVC). We build it
      # manually via `cargo build -p yara-x-capi --release` (see
      # tools/yara-x/README.md "Linux (x86_64)") and bundle the resulting
      # libyara_x_capi.so directly in tools/yara-x/linux64/. The maven
      # `copy-yara-x` execution in iped-app/pom.xml ships it into the
      # release tree at build time.
      #
      # The integration tests still gate on YARA_X_LIB_PATH (and the JNA
      # path); we point it at the bundled .so so YaraEngineTest etc. run
      # in this CI job too. If the file is missing the build fails fast
      # rather than silently skipping.
      run: |
          test -f tools/yara-x/linux64/libyara_x_capi.so \
            || { echo "Missing tools/yara-x/linux64/libyara_x_capi.so — see tools/yara-x/README.md"; exit 1; }
          echo "YARA_X_LIB_PATH=$(pwd)/tools/yara-x/linux64/libyara_x_capi.so" >> "$GITHUB_ENV"
          ldd tools/yara-x/linux64/libyara_x_capi.so


    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - shell: bash
      run:
        cd target && mv release iped-snapshot-$GITHUB_SHA && tar -zcvf ../iped-snapshot.tar.gz iped-snapshot-$GITHUB_SHA
    - name: Upload snapshot
      uses: actions/upload-artifact@v4
      with:
        name: iped-snapshot-${{ github.sha }}
        path: iped-snapshot.tar.gz

  build-java14:
    
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v1
    - run: curl -O "https://download.bell-sw.com/java/14.0.2+13/bellsoft-jdk14.0.2+13-linux-amd64-full.tar.gz"
    - name: Set up JDK 14
      uses: actions/setup-java@v1
      with:
        java-version: 14
        jdkFile: ./bellsoft-jdk14.0.2+13-linux-amd64-full.tar.gz

    - name: Load libagdb from cache
      id: libagdb
      uses: actions/cache@v4
      with:
        path: libagdb
        key: libagdb

    - name: Compile libagdb
      # libagdb (agdbinfo) needs to be built from source
      if: steps.libagdb.outputs.cache-hit != 'true'
      run: | 
            sudo apt install git autoconf automake autopoint libtool pkg-config
            git clone https://github.com/libyal/libagdb.git && cd libagdb/ && git checkout 667a782
            sudo ./synclibs.sh && sudo ./autogen.sh && sudo ./configure

    - name: Install External Tools
      run: |        
          sudo add-apt-repository ppa:alex-p/tesseract-ocr-devel && sudo apt-get update && sudo apt-get install \
          libscca-utils rifiuti2 libevtx-utils libevt-utils \
          libmsiecf-utils=20181227-2build1 \
          pff-tools=20180714-3build1 \
          libesedb-utils=20181229-3.1build2 \
          tesseract-ocr \
          tesseract-ocr-por \
          imagemagick \
          python3-pip
          sudo perl -MCPAN -e 'install Parse::Win32Registry'
          pip install jep==4.0.3

          cd libagdb/ && sudo make install
          sudo ldconfig /usr/local/lib
          cd ..
          sudo apt-get install gsfonts

    - name: Verify bundled libyara-x-capi (YARA-X engine, Linux)
      # The YARA-X 1.16.0 upstream release does NOT publish a prebuilt
      # libyara-x-capi for Linux x86_64 (only Windows MSVC). We build it
      # manually via `cargo build -p yara-x-capi --release` (see
      # tools/yara-x/README.md "Linux (x86_64)") and bundle the resulting
      # libyara_x_capi.so directly in tools/yara-x/linux64/. The maven
      # `copy-yara-x` execution in iped-app/pom.xml ships it into the
      # release tree at build time.
      #
      # The integration tests still gate on YARA_X_LIB_PATH (and the JNA
      # path); we point it at the bundled .so so YaraEngineTest etc. run
      # in this CI job too. If the file is missing the build fails fast
      # rather than silently skipping.
      run: |
          test -f tools/yara-x/linux64/libyara_x_capi.so \
            || { echo "Missing tools/yara-x/linux64/libyara_x_capi.so — see tools/yara-x/README.md"; exit 1; }
          echo "YARA_X_LIB_PATH=$(pwd)/tools/yara-x/linux64/libyara_x_capi.so" >> "$GITHUB_ENV"
          ldd tools/yara-x/linux64/libyara_x_capi.so

    - name: Build with Maven
      run: mvn -B package --file pom.xml
