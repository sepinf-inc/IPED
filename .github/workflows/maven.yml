name: Java CI

on: [push, pull_request]

jobs:

  build-java11:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 11
      uses: actions/setup-java@v6
      with:
        distribution: liberica
        java-version: 11
        java-package: jdk+fx
        cache-jdk: true

    - name: Restore Maven repository
      # Restore and save are split so a partial repository is cached even when
      # the build fails (e.g. HTTP 429 from iped-maven), see #3047
      id: m2
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.m2/repository
          !~/.m2/repository/**/*.lastUpdated
        key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          maven-${{ runner.os }}-

    - name: Load libagdb from cache
      id: libagdb
      uses: actions/cache@v5
      with:
        path: libagdb
        key: libagdb

    - name: Compile libagdb
      # libagdb (agdbinfo) needs to be built from source
      if: steps.libagdb.outputs.cache-hit != 'true'
      run: | 
            sudo apt install git autoconf automake autopoint libtool pkg-config
            git clone https://github.com/libyal/libagdb.git && cd libagdb/ && git checkout 667a782
            sudo ./synclibs.sh && sudo ./autogen.sh && sudo ./configure

    - name: Install External Tools
      run: |
          sudo apt-get update && sudo apt-get install \
          libscca-utils rifiuti2 libevtx-utils libevt-utils \
          libmsiecf-utils=20181227-2build1 \
          pff-tools=20180714-3build1 \
          libesedb-utils=20181229-3.1build2 \
          tesseract-ocr \
          tesseract-ocr-por \
          imagemagick \
          python3-pip
          sudo perl -MCPAN -e 'install Parse::Win32Registry'
          pip install jep==4.0.3

          cd libagdb/ && sudo make install
          sudo ldconfig /usr/local/lib
          cd ..
          sudo apt-get install gsfonts


    - name: Build with Maven
      id: build
      run: mvn -B -ntp package --file pom.xml

    - name: Save Maven repository
      # full key on success; on failure a partial key, restored next time through restore-keys
      if: always() && steps.m2.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.m2/repository
          !~/.m2/repository/**/*.lastUpdated
        key: ${{ steps.build.outcome == 'success' && steps.m2.outputs.cache-primary-key || format('{0}-partial-{1}-{2}-{3}', steps.m2.outputs.cache-primary-key, github.job, github.run_id, github.run_attempt) }}
    - shell: bash
      run:
        cd target && mv release iped-snapshot-$GITHUB_SHA && tar -zcvf ../iped-snapshot.tar.gz iped-snapshot-$GITHUB_SHA
    - name: Upload snapshot
      uses: actions/upload-artifact@v4
      with:
        name: iped-snapshot-${{ github.sha }}
        path: iped-snapshot.tar.gz

  build-java14:
    
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 14
      uses: actions/setup-java@v6
      with:
        distribution: liberica
        java-version: 14
        java-package: jdk+fx
        cache-jdk: true

    - name: Restore Maven repository
      # Restore and save are split so a partial repository is cached even when
      # the build fails (e.g. HTTP 429 from iped-maven), see #3047
      id: m2
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.m2/repository
          !~/.m2/repository/**/*.lastUpdated
        key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          maven-${{ runner.os }}-

    - name: Load libagdb from cache
      id: libagdb
      uses: actions/cache@v5
      with:
        path: libagdb
        key: libagdb

    - name: Compile libagdb
      # libagdb (agdbinfo) needs to be built from source
      if: steps.libagdb.outputs.cache-hit != 'true'
      run: | 
            sudo apt install git autoconf automake autopoint libtool pkg-config
            git clone https://github.com/libyal/libagdb.git && cd libagdb/ && git checkout 667a782
            sudo ./synclibs.sh && sudo ./autogen.sh && sudo ./configure

    - name: Install External Tools
      run: |        
          sudo add-apt-repository ppa:alex-p/tesseract-ocr-devel && sudo apt-get update && sudo apt-get install \
          libscca-utils rifiuti2 libevtx-utils libevt-utils \
          libmsiecf-utils=20181227-2build1 \
          pff-tools=20180714-3build1 \
          libesedb-utils=20181229-3.1build2 \
          tesseract-ocr \
          tesseract-ocr-por \
          imagemagick \
          python3-pip
          sudo perl -MCPAN -e 'install Parse::Win32Registry'
          pip install jep==4.0.3

          cd libagdb/ && sudo make install
          sudo ldconfig /usr/local/lib
          cd ..
          sudo apt-get install gsfonts

    - name: Build with Maven
      id: build
      run: mvn -B -ntp package --file pom.xml

    - name: Save Maven repository
      # full key on success; on failure a partial key, restored next time through restore-keys
      if: always() && steps.m2.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.m2/repository
          !~/.m2/repository/**/*.lastUpdated
        key: ${{ steps.build.outcome == 'success' && steps.m2.outputs.cache-primary-key || format('{0}-partial-{1}-{2}-{3}', steps.m2.outputs.cache-primary-key, github.job, github.run_id, github.run_attempt) }}
